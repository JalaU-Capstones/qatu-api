# ─────────────────────────────────────────────────────────────────────────────
# Qatu API — Docker Compose DEV override
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Mode A: DB is Supabase CLI on host :54322. No postgres container.
#
# Differences from base:
#   - api runs `pnpm dev` (nodemon) with source bind-mount for hot reload.
#   - api is exposed on host:3000 for frontend dev.
#   - rabbitmq management UI is exposed on host:15672.
# ─────────────────────────────────────────────────────────────────────────────

services:
  rabbitmq:
    ports:
      - '15672:15672'

  api:
    # `target: development` (not `build`) so the entrypoint.sh runs and
    # migrations are applied before `pnpm dev` starts the API. Without this,
    # the container boots with an empty database.
    build:
      context: .
      target: development
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev"
    environment:
      NODE_ENV: development
      # Seeds run automatically in dev (idempotent). Override in .env with RUN_SEEDS=false if needed.
      RUN_SEEDS: 'true'
      PORT: 3000
      # Containerized API → host Supabase CLI for auth (Mode A).
      # On Linux hosts, `extra_hosts` below maps host.docker.internal.
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:54321}
      SUPABASE_STORAGE_PUBLIC_URL: ${SUPABASE_STORAGE_PUBLIC_URL:-http://localhost:54321/storage/v1/object/public}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      # Point to Supabase CLI DB (Mode A).
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:54322/postgres}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    ports:
      - '3000:3000'
    extra_hosts:
      # On Linux with user-defined bridge network qatu-net (172.19.0.0/16),
      # host-gateway resolves to inactive docker0 (172.17.0.1). 172.19.0.1 is the active bridge gateway.
      - 'host.docker.internal:172.19.0.1'
