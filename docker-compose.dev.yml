# ─────────────────────────────────────────────────────────────────────────────
# Qatu API — Docker Compose DEV override
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Mode A: DB is Supabase CLI on host :54322. No postgres container.
#
# Differences from base:
#   - api runs `pnpm dev` (nodemon) with source bind-mount for hot reload.
#   - api is exposed on host:3000 for frontend dev.
#   - rabbitmq management UI is exposed on host:15672.
#   - Runtime secrets/config from .env are re-declared as ${VAR} so they are
#     overridable via shell env / compose without editing the file (Lab W3 #3).
# ─────────────────────────────────────────────────────────────────────────────

services:
  rabbitmq:
    ports:
      - '15672:15672'

  api:
    # `target: development` (not `build`) so the entrypoint.sh runs and
    # migrations are applied before `pnpm dev` starts the API. Without this,
    # the container boots with an empty database.
    build:
      context: .
      target: development
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev"
    environment:
      NODE_ENV: development
      # Seeds run automatically in dev (idempotent). Override in .env with RUN_SEEDS=false if needed.
      RUN_SEEDS: ${RUN_SEEDS:-true}
      PORT: ${PORT:-3000}
      # Containerized API → host Supabase CLI for auth (Mode A).
      # On Linux hosts, `extra_hosts` below maps host.docker.internal.
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:54321}
      SUPABASE_STORAGE_PUBLIC_URL: ${SUPABASE_STORAGE_PUBLIC_URL:-http://localhost:54321/storage/v1/object/public}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-avatars}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      # Mode A (ADR-020): Supabase CLI DB on the host, not a compose postgres.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:54322/postgres}
      # Broker (ADR-014) — overridable without editing .env
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://qatu:qatu_dev_password@rabbitmq:5672}
      RABBITMQ_ENABLED: ${RABBITMQ_ENABLED:-false}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-qatu.events}
      RABBITMQ_NOTIFICATIONS_QUEUE: ${RABBITMQ_NOTIFICATIONS_QUEUE:-qatu.notifications}
      RABBITMQ_DLX: ${RABBITMQ_DLX:-qatu.dlx}
      RABBITMQ_DLQ: ${RABBITMQ_DLQ:-qatu.notifications.dlq}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-2000}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-3}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    ports:
      - '3000:3000'
    extra_hosts:
      # On Linux with user-defined bridge network qatu-net (172.19.0.0/16),
      # host-gateway resolves to inactive docker0 (172.17.0.1). 172.19.0.1 is the active bridge gateway.
      - 'host.docker.internal:172.19.0.1'
