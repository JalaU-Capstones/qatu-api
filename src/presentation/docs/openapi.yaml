      $ref: './components/responses/success.yaml#/NoContent'

  examples:
    RegisterRequest:
      $ref: './components/examples/auth.yaml#/RegisterRequest'
    RegisterResponse:
      $ref: './components/examples/auth.yaml#/RegisterResponse'
    LoginRequest:
      $ref: './components/examples/auth.yaml#/LoginRequest'
    LoginResponse:
      $ref: './components/examples/auth.yaml#/LoginResponse'
    CurrentUserResponse:
      $ref: './components/examples/auth.yaml#/CurrentUserResponse'
    productList:
      $ref: './components/examples/products.yaml#/productList'
    productDetail:
      $ref: './components/examples/products.yaml#/productDetail'
    createProduct:
      $ref: './components/examples/products.yaml#/createProduct'
    orderList:
      $ref: './components/examples/orders.yaml#/orderList'
    orderDetail:
      $ref: './components/examples/orders.yaml#/orderDetail'
    createOrder:
      $ref: './components/examples/orders.yaml#/createOrder'
