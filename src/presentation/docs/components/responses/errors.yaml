BadRequest:
  description: Bad Request — validation error or malformed request syntax.
  content:
    application/json:
      schema:
        $ref: '../schemas/Error.yaml'
      examples:
        validationError:
          summary: Validation error
          value:
            error:
              code: 'VALIDATION_ERROR'
              message: 'The request body is invalid. See error.details for field-level errors.'
              details:
                - field: 'name'
                  message: 'Name is required'
            meta:
              timestamp: '2026-10-14T12:00:00.000Z'

Unauthorized:
  description: Unauthorized — missing, invalid, or expired authentication token.
  content:
    application/json:
      schema:
        $ref: '../schemas/Error.yaml'
      examples:
        missingToken:
          summary: Missing or invalid token
          value:
            error:
              code: 'UNAUTHORIZED'
              message: 'Authentication required or session expired.'
            meta:
              timestamp: '2026-10-14T12:00:00.000Z'

Forbidden:
  description: Forbidden — authenticated user lacks required permissions or role.
  content:
    application/json:
      schema:
        $ref: '../schemas/Error.yaml'
      examples:
        insufficientRole:
          summary: Insufficient role permissions
          value:
            error:
              code: 'FORBIDDEN'
              message: 'You do not have permission to perform this action.'
            meta:
              timestamp: '2026-10-14T12:00:00.000Z'

NotFound:
  description: Not Found — the requested resource does not exist.
  content:
    application/json:
      schema:
        $ref: '../schemas/Error.yaml'
      examples:
        resourceNotFound:
          summary: Resource not found
          value:
            error:
              code: 'NOT_FOUND'
              message: 'The requested resource was not found.'
            meta:
              timestamp: '2026-10-14T12:00:00.000Z'

Conflict:
  description: Conflict — duplicate resource or incompatible state transition.
  content:
    application/json:
      schema:
        $ref: '../schemas/Error.yaml'
      examples:
        conflictError:
          summary: State or uniqueness conflict
          value:
            error:
              code: 'CONFLICT'
              message: 'The request conflicts with the current state of the resource.'
            meta:
              timestamp: '2026-10-14T12:00:00.000Z'

UnprocessableEntity:
  description: |
    The request was well-formed but cannot be processed due to semantic errors.
    The exact reason depends on the endpoint — check `error.code` for the specific case.
  content:
    application/json:
      schema:
        $ref: '../schemas/Error.yaml'
      examples:
        validation:
          summary: Field-level validation failure
          value:
            error:
              code: 'VALIDATION_ERROR'
              message: 'One or more fields have invalid values.'
              details:
                - field: 'new_password'
                  message: 'Password must be at least 8 characters long.'
            meta:
              timestamp: '2026-10-14T12:00:00.000Z'
        insufficientStock:
          summary: Product stock too low (checkout context)
          value:
            error:
              code: 'INSUFFICIENT_STOCK'
              message: 'Requested quantity exceeds available inventory.'
              details: []
            meta:
              timestamp: '2026-10-14T12:00:00.000Z'
        invalidStatusTransition:
          summary: Invalid order status transition
          value:
            error:
              code: 'INVALID_STATUS_TRANSITION'
              message: 'Cannot transition the order to the requested status.'
              details: []
            meta:
              timestamp: '2026-10-14T12:00:00.000Z'
        fileTooLarge:
          summary: Uploaded file exceeds size limit
          value:
            error:
              code: 'FILE_TOO_LARGE'
              message: 'The uploaded file exceeds the maximum allowed size.'
              details: []
            meta:
              timestamp: '2026-10-14T12:00:00.000Z'

TooManyRequests:
  description: Too Many Requests — client exceeded rate limit.
  headers:
    X-RateLimit-Limit:
      schema:
        type: integer
      description: The maximum number of allowed requests in the current window.
    X-RateLimit-Remaining:
      schema:
        type: integer
      description: The number of remaining requests in the current window.
    X-RateLimit-Reset:
      schema:
        type: integer
      description: Epoch timestamp (seconds) when the current window resets.
  content:
    application/json:
      schema:
        $ref: '../schemas/Error.yaml'
      examples:
        rateLimitExceeded:
          summary: Rate limit exceeded
          value:
            error:
              code: 'TOO_MANY_REQUESTS'
              message: 'Too many requests. Try again later.'
            meta:
              timestamp: '2026-10-14T12:00:00.000Z'

InternalServerError:
  description: Internal Server Error — unexpected error occurred on the server.
  content:
    application/json:
      schema:
        $ref: '../schemas/Error.yaml'
      examples:
        internalError:
          summary: Unexpected server error
          value:
            error:
              code: 'INTERNAL_SERVER_ERROR'
              message: 'An unexpected error occurred on the server.'
            meta:
              timestamp: '2026-10-14T12:00:00.000Z'
