type: object
description: Snapshot of an individual product purchased within an order.
required:
  - id
  - order_id
  - product_name
  - quantity
  - unit_price
  - subtotal
  - created_at
properties:
  id:
    type: string
    format: uuid
    readOnly: true
    description: Unique identifier of the order line item.
    examples:
      - 'e1f2a3b4-c5d6-7e8f-9a0b-1c2d3e4f5a6b'
  order_id:
    type: string
    format: uuid
    readOnly: true
    description: Identifier of the parent order.
    examples:
      - '9d1e2f3a-4b5c-6d7e-8f9a-0b1c2d3e4f5a'
  product_id:
    type: [string, 'null']
    format: uuid
    description: Identifier of the referenced product. Null if product was deleted.
    examples:
      - '7e2b9a6c-1f2d-4b6e-8c3a-9d5f1e2a4b7c'
  product_name:
    type: string
    description: Immutable historical product name captured at time of order creation.
    examples:
      - 'Ergonomic Office Chair'
  product_image_path:
    type: [string, 'null']
    description: Image storage path captured at time of order creation.
    examples:
      - 'product-images/7e2b9a6c-1f2d-4b6e-8c3a-9d5f1e2a4b7c/chair-front.webp'
  quantity:
    type: integer
    minimum: 1
    description: Number of units purchased in this order line item.
    examples:
      - 1
  unit_price:
    type: number
    format: double
    minimum: 0
    description: Price per unit at the time of purchase.
    examples:
      - 199.99
  subtotal:
    type: number
    format: double
    minimum: 0
    readOnly: true
    description: Line item subtotal amount (quantity * unit_price).
    examples:
      - 199.99
  created_at:
    type: string
    format: date-time
    readOnly: true
    description: Record creation timestamp.
    examples:
      - '2026-10-14T11:00:00.000Z'
additionalProperties: false
