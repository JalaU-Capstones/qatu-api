Meta:
  type: object
  description: Standard response metadata containing server timestamp.
  required:
    - timestamp
  properties:
    timestamp:
      type: string
      format: date-time
      description: ISO 8601 UTC timestamp when the response was generated.
      examples:
        - '2026-10-14T12:00:00.000Z'
  additionalProperties: false

PaginationMeta:
  type: object
  description: Pagination metadata for list responses.
  required:
    - page
    - per_page
    - total
    - total_pages
  properties:
    page:
      type: integer
      minimum: 1
      description: Current page number (1-indexed).
      examples: [1]
    per_page:
      type: integer
      minimum: 1
      maximum: 100
      description: Maximum number of items per page.
      examples: [20]
    total:
      type: integer
      minimum: 0
      description: Total number of matching records.
      examples: [100]
    total_pages:
      type: integer
      minimum: 0
      description: Total number of pages available.
      examples: [5]
  additionalProperties: false

ErrorDetail:
  type: object
  description: Individual field-level error detail.
  required:
    - field
    - message
  properties:
    field:
      type: string
      description: The request field that caused the validation failure.
      examples:
        - 'email'
    message:
      type: string
      description: Descriptive explanation of the validation failure.
      examples:
        - 'Email is required'
  additionalProperties: false

UUID:
  type: string
  format: uuid
  description: Universally Unique Identifier (UUIDv4).
  examples:
    - 'a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11'

Currency:
  type: string
  description: ISO 4217 three-letter currency code.
  enum:
    - USD
    - EUR
    - BOB
    - PEN
    - ARS
    - COP
    - MXN
    - BRL
  examples:
    - 'USD'
