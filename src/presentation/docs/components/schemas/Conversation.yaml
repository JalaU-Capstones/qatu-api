type: object
description: A buyer-seller conversation thread, optionally associated with a specific product.
required:
  - id
  - buyer_id
  - seller_id
  - last_message_at
  - created_at
  - updated_at
properties:
  id:
    type: string
    format: uuid
    readOnly: true
    description: Unique identifier of the conversation.
    examples:
      - 'b2c3d4e5-f6a7-8b9c-0d1e-2f3a4b5c6d7e'
  buyer_id:
    type: string
    format: uuid
    readOnly: true
    description: Profile identifier of the buyer participant.
    examples:
      - 'a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11'
  seller_id:
    type: string
    format: uuid
    readOnly: true
    description: Profile identifier of the seller participant.
    examples:
      - 'c3d4e5f6-a7b8-4c9d-0e1f-2a3b4c5d6e7f'
  product_id:
    type: [string, 'null']
    format: uuid
    description: Optional product identifier the conversation is about.
    examples:
      - '7e2b9a6c-1f2d-4b6e-8c3a-9d5f1e2a4b7c'
  last_message_at:
    type: string
    format: date-time
    readOnly: true
    description: Timestamp of the most recent message in this conversation.
    examples:
      - '2026-10-14T13:30:00.000Z'
  created_at:
    type: string
    format: date-time
    readOnly: true
    description: Conversation creation timestamp.
    examples:
      - '2026-10-14T12:00:00.000Z'
  updated_at:
    type: string
    format: date-time
    readOnly: true
    description: Conversation last update timestamp.
    examples:
      - '2026-10-14T13:30:00.000Z'
additionalProperties: false
