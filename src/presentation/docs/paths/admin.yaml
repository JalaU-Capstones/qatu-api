      '401':
        $ref: '../components/responses/errors.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses/errors.yaml#/Forbidden'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

productsReport:
  get:
    operationId: adminGetProductsReport
    summary: Get products report (admin)
    description: |
      Returns aggregated product metrics including listings, categories distribution,
      and top-rated products. Admin only.
    tags:
      - admin
    parameters:
      - name: from
        in: query
        required: true
        description: Start date (ISO 8601 date, inclusive).
        schema:
          type: string
          format: date
          example: '2026-01-01'
      - name: to
        in: query
        required: true
        description: End date (ISO 8601 date, inclusive).
        schema:
          type: string
          format: date
          example: '2026-10-14'
    responses:
      '200':
        description: Products metrics report.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  properties:
                    total_products:
                      type: integer
                      example: 856
                    published_products:
                      type: integer
                      example: 712
                    draft_products:
                      type: integer
                      example: 144
                    new_listings:
                      type: integer
                      example: 63
                    top_categories:
                      type: array
                      items:
                        type: object
                        properties:
                          category_id:
                            type: string
                            format: uuid
                          name:
                            type: string
                          product_count:
                            type: integer
                    top_rated_products:
                      type: array
                      items:
                        type: object
                        properties:
                          product_id:
                            type: string
                            format: uuid
                          title:
                            type: string
                          average_rating:
                            type: number
                            format: float
                          rating_count:
                            type: integer
                meta:
                  $ref: '../components/schemas/shared.yaml#/Meta'
            examples:
              productsReport:
                summary: Products report
                value:
                  data:
                    total_products: 856
                    published_products: 712
                    draft_products: 144
                    new_listings: 63
                    top_categories:
                      - category_id: 'b2d3c4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e'
                        name: Electronics
                        product_count: 142
                    top_rated_products:
                      - product_id: '7e2b9a6c-1f2d-4b6e-8c3a-9d5f1e2a4b7c'
                        title: 'Handcrafted Leather Wallet'
                        average_rating: 4.8
                        rating_count: 156
                  meta:
                    timestamp: '2026-10-14T12:00:00.000Z'
      '400':
        $ref: '../components/responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../components/responses/errors.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses/errors.yaml#/Forbidden'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
