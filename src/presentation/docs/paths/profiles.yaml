getById:
  get:
    operationId: getProfileById
    summary: Get a public profile by ID
    description: |
      Returns publicly visible profile information for any user. No authentication required.
    tags:
      - profiles
    security: []
    parameters:
      - $ref: '../components/parameters/path-ids.yaml#/id'
    responses:
      '200':
        description: Profile retrieved successfully.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '../components/schemas/Profile.yaml'
                meta:
                  $ref: '../components/schemas/shared.yaml#/Meta'
            examples:
              default:
                summary: Public profile
                value:
                  data:
                    id: 'a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11'
                    username: 'john_doe'
                    full_name: 'John Doe'
                    avatar_path: null
                    bio: 'Artisan collector.'
                    locale: 'en'
                    created_at: '2026-10-01T00:00:00.000Z'
                    updated_at: '2026-10-01T00:00:00.000Z'
                  meta:
                    timestamp: '2026-10-14T12:00:00.000Z'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFound'
      '429':
        $ref: '../components/responses/errors.yaml#/TooManyRequests'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

updateMe:
  patch:
    operationId: updateMyProfile
    summary: Update own profile
    description: |
      Partially updates the authenticated user's profile fields.
      Only the fields provided in the request body are updated.
    tags:
      - profiles
    parameters:
      - $ref: '../components/parameters/csrf-token.yaml#/csrfToken'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              full_name:
                type: string
                minLength: 2
                maxLength: 100
                description: Display full name.
              bio:
                type: [string, 'null']
                maxLength: 500
                description: Short profile biography.
              avatar_path:
                type: [string, 'null']
                maxLength: 500
                description: Storage path of the user's avatar image in Supabase Storage.
              locale:
                type: string
                maxLength: 20
                description: Preferred locale code.
            additionalProperties: false
          examples:
            default:
              summary: Update full name, bio, and avatar
              value:
                full_name: 'Camila Morales'
                bio: 'Coleccionista de textiles y cerámica andina.'
                avatar_path: 'https://cdn.qatu.pe/avatars/a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11/avatar.webp'
                locale: 'es-PE'
    responses:
      '200':
        description: Profile updated successfully.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '../components/schemas/Profile.yaml'
                meta:
                  $ref: '../components/schemas/shared.yaml#/Meta'
            examples:
              default:
                summary: Updated profile
                value:
                  data:
                    id: 'a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11'
                    username: 'camila_m'
                    full_name: 'Camila Morales'
                    avatar_path: 'https://cdn.qatu.pe/avatars/a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11/avatar.webp'
                    bio: 'Coleccionista de textiles y cerámica andina.'
                    locale: 'es-PE'
                    created_at: '2026-10-01T00:00:00.000Z'
                    updated_at: '2026-10-14T12:00:00.000Z'
                  meta:
                    timestamp: '2026-10-14T12:00:00.000Z'
      '400':
        $ref: '../components/responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../components/responses/errors.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFound'
      '429':
        $ref: '../components/responses/errors.yaml#/TooManyRequests'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

uploadAvatar:
  post:
    operationId: uploadAvatar
    summary: Upload own avatar
    description: |
      Uploads an avatar image for the authenticated user's profile using `multipart/form-data`.
      The image is stored in Supabase Storage and the `profiles.avatar_path` is updated.
    tags:
      - profiles
    parameters:
      - $ref: '../components/parameters/csrf-token.yaml#/csrfToken'
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - image
            properties:
              image:
                type: string
                format: binary
                description: Image file (JPEG, PNG, WebP). Max 2 MB.
    responses:
      '200':
        description: Avatar uploaded successfully.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '../components/schemas/Profile.yaml'
                meta:
                  $ref: '../components/schemas/shared.yaml#/Meta'
      '400':
        $ref: '../components/responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../components/responses/errors.yaml#/Unauthorized'
      '422':
        description: The uploaded file is too large or has an unsupported format.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/Error.yaml'
            examples:
              fileTooLarge:
                summary: File exceeds size limit
                value:
                  error:
                    code: 'FILE_TOO_LARGE'
                    message: 'The image exceeds the maximum size of 2 MB.'
                    details: []
                  meta:
                    timestamp: '2026-10-14T12:00:00.000Z'
              invalidFormat:
                summary: Unsupported image format
                value:
                  error:
                    code: 'INVALID_FILE_FORMAT'
                    message: 'Only JPEG, PNG, and WebP images are accepted.'
                    details: []
                  meta:
                    timestamp: '2026-10-14T12:00:00.000Z'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
