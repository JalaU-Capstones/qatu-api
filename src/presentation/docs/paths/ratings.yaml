create:
  post:
    operationId: createRating
    summary: Submit a rating
    description: |
      Allows a buyer to rate a product after a completed order.
      A buyer may only rate a product once per order. Ratings affect the product's and seller's average scores.
    tags:
      - ratings
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - product_id
              - order_id
              - rating
            properties:
              product_id:
                type: string
                format: uuid
                example: '7e2b9a6c-1f2d-4b6e-8c3a-9d5f1e2a4b7c'
              order_id:
                type: string
                format: uuid
                example: '9d1e2f3a-4b5c-6d7e-8f9a-0b1c2d3e4f5a'
              rating:
                type: integer
                minimum: 1
                maximum: 5
                example: 5
              comment:
                type: string
                maxLength: 1000
                example: 'Excellent quality! Fast shipping and well packaged.'
          examples:
            createRating:
              summary: 5-star review with comment
              value:
                product_id: '7e2b9a6c-1f2d-4b6e-8c3a-9d5f1e2a4b7c'
                order_id: '9d1e2f3a-4b5c-6d7e-8f9a-0b1c2d3e4f5a'
                rating: 5
                comment: 'Excellent quality! Fast shipping and well packaged.'
    responses:
      '201':
        description: Rating submitted successfully.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '../components/schemas/Rating.yaml'
                meta:
                  $ref: '../components/schemas/shared.yaml#/Meta'
            examples:
              ratingResponse:
                summary: Submitted rating
                value:
                  data:
                    id: 'a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d'
                    product_id: '7e2b9a6c-1f2d-4b6e-8c3a-9d5f1e2a4b7c'
                    buyer_id: 'a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11'
                    order_id: '9d1e2f3a-4b5c-6d7e-8f9a-0b1c2d3e4f5a'
                    rating: 5
                    comment: 'Excellent quality! Fast shipping and well packaged.'
                    created_at: '2026-10-14T14:00:00.000Z'
                    updated_at: '2026-10-14T14:00:00.000Z'
                  meta:
                    timestamp: '2026-10-14T14:00:00.000Z'
      '400':
        $ref: '../components/responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../components/responses/errors.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses/errors.yaml#/Forbidden'
      '409':
        $ref: '../components/responses/errors.yaml#/Conflict'
      '422':
        $ref: '../components/responses/errors.yaml#/UnprocessableEntity'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

listByProduct:
  get:
    operationId: listProductRatings
    summary: List ratings for a product (public)
    description: Returns a paginated list of ratings for a specific product. Public endpoint.
    tags:
      - ratings
    security: []
    parameters:
      - $ref: '../components/parameters/path-ids.yaml#/productId'
      - $ref: '../components/parameters/pagination.yaml#/page'
      - $ref: '../components/parameters/pagination.yaml#/limit'
    responses:
      '200':
        description: Paginated ratings list.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas/Rating.yaml'
                meta:
                  $ref: '../components/schemas/shared.yaml#/PaginationMeta'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFound'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

listBySeller:
  get:
    operationId: listSellerRatings
    summary: List ratings for a seller (public)
    description: Returns a paginated list of ratings for all products belonging to a specific seller. Public endpoint.
    tags:
      - ratings
    security: []
    parameters:
      - $ref: '../components/parameters/path-ids.yaml#/sellerId'
      - $ref: '../components/parameters/pagination.yaml#/page'
      - $ref: '../components/parameters/pagination.yaml#/limit'
    responses:
      '200':
        description: Paginated seller ratings list.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas/Rating.yaml'
                meta:
                  $ref: '../components/schemas/shared.yaml#/PaginationMeta'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFound'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
