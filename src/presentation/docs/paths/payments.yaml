createOrGet:
  post:
    operationId: createPayment
    summary: Create a payment record
    description: |
      Initiates a payment for an order. Creates a `Payment` record associated with the order.
      The order must be in `confirmed` status to be paid. Only the buyer who placed the order may pay.
    tags:
      - payments
    parameters:
      - $ref: '../components/parameters/path-ids.yaml#/orderId'
      - $ref: '../components/parameters/csrf-token.yaml#/csrfToken'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - method
            properties:
              method:
                type: string
                enum: [simulated, stripe, paypal, cash_on_delivery]
                example: simulated
              amount:
                type: number
                format: double
                minimum: 0.01
                description: Payment amount. Must match the order total.
                example: 214.99
          examples:
            createPayment:
              summary: Process simulated payment
              value:
                method: simulated
                amount: 214.99
    responses:
      '201':
        description: Payment record created.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '../components/schemas/Payment.yaml'
                meta:
                  $ref: '../components/schemas/shared.yaml#/Meta'
            examples:
              paymentResponse:
                summary: Payment record
                value:
                  data:
                    id: 'f2a3b4c5-d6e7-8f9a-0b1c-2d3e4f5a6b7c'
                    order_id: '9d1e2f3a-4b5c-6d7e-8f9a-0b1c2d3e4f5a'
                    amount: 214.99
                    currency: 'USD'
                    method: simulated
                    status: pending
                    created_at: '2026-10-14T12:05:00.000Z'
                    updated_at: '2026-10-14T12:05:00.000Z'
                  meta:
                    timestamp: '2026-10-14T12:05:00.000Z'
      '400':
        $ref: '../components/responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../components/responses/errors.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses/errors.yaml#/Forbidden'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFound'
      '409':
        $ref: '../components/responses/errors.yaml#/Conflict'
      '422':
        $ref: '../components/responses/errors.yaml#/UnprocessableEntity'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

  get:
    operationId: getPayment
    summary: Get payment for an order
    description: Returns the payment record associated with an order. Accessible by the buyer or seller of the order.
    tags:
      - payments
    parameters:
      - $ref: '../components/parameters/path-ids.yaml#/orderId'
    responses:
      '200':
        description: Payment record.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '../components/schemas/Payment.yaml'
                meta:
                  $ref: '../components/schemas/shared.yaml#/Meta'
      '401':
        $ref: '../components/responses/errors.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses/errors.yaml#/Forbidden'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFound'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
