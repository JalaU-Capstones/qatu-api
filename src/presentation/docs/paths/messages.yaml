listOrSend:
  get:
    operationId: listMessages
    summary: List messages in a conversation
    description: |
      Returns a paginated list of messages in a specific conversation.
      Only participants (buyer or seller) may read the messages.
    tags:
      - messages
    parameters:
      - $ref: '../components/parameters/path-ids.yaml#/conversationId'
      - $ref: '../components/parameters/pagination.yaml#/page'
      - $ref: '../components/parameters/pagination.yaml#/limit'
    responses:
      '200':
        description: Paginated messages list.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas/Message.yaml'
                meta:
                  $ref: '../components/schemas/shared.yaml#/PaginationMeta'
            examples:
              messageList:
                summary: Conversation messages
                value:
                  data:
                    - id: 'c3d4e5f6-a7b8-9c0d-1e2f-3a4b5c6d7e8f'
                      conversation_id: 'b2c3d4e5-f6a7-8b9c-0d1e-2f3a4b5c6d7e'
                      sender_id: 'a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11'
                      content: 'Hello, is this wallet still available?'
                      created_at: '2026-10-14T10:05:00.000Z'
                    - id: 'd4e5f6a7-b8c9-0d1e-2f3a-4b5c6d7e8f9a'
                      conversation_id: 'b2c3d4e5-f6a7-8b9c-0d1e-2f3a4b5c6d7e'
                      sender_id: 'c3d4e5f6-a7b8-4c9d-0e1f-2a3b4c5d6e7f'
                      content: 'Yes, it is! Would you like to order one?'
                      created_at: '2026-10-14T10:10:00.000Z'
                  meta:
                    page: 1
                    per_page: 20
                    total: 2
                    total_pages: 1
      '401':
        $ref: '../components/responses/errors.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses/errors.yaml#/Forbidden'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFound'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

  post:
    operationId: sendMessage
    summary: Send a message
    description: |
      Sends a new message in a conversation. Only participants may send messages.
      Triggers a notification for the recipient.
    tags:
      - messages
    parameters:
      - $ref: '../components/parameters/path-ids.yaml#/conversationId'
      - $ref: '../components/parameters/csrf-token.yaml#/csrfToken'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - content
            properties:
              content:
                type: string
                minLength: 1
                maxLength: 2000
                example: 'Hello, is this wallet still available?'
          examples:
            sendMessage:
              summary: Send a message
              value:
                content: 'Hello, is this wallet still available?'
    responses:
      '201':
        description: Message sent successfully.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '../components/schemas/Message.yaml'
                meta:
                  $ref: '../components/schemas/shared.yaml#/Meta'
            examples:
              messageResponse:
                summary: Sent message
                value:
                  data:
                    id: 'c3d4e5f6-a7b8-9c0d-1e2f-3a4b5c6d7e8f'
                    conversation_id: 'b2c3d4e5-f6a7-8b9c-0d1e-2f3a4b5c6d7e'
                    sender_id: 'a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11'
                    content: 'Hello, is this wallet still available?'
                    created_at: '2026-10-14T10:05:00.000Z'
                  meta:
                    timestamp: '2026-10-14T10:05:00.000Z'
      '400':
        $ref: '../components/responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../components/responses/errors.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses/errors.yaml#/Forbidden'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFound'
      '422':
        $ref: '../components/responses/errors.yaml#/UnprocessableEntity'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
