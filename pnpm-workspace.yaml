onlyBuiltDependencies:
  - '@scarf/scarf'
  - cpu-features
  - esbuild
  - protobufjs
  - ssh2

allowBuilds:
  '@scarf/scarf': true
  cpu-features: true
  esbuild: true
  protobufjs: true
  ssh2: true

overrides:
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  undici@>=8.0.0 <8.12.2: ^8.12.2
