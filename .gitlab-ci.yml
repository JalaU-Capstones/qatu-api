image: node:26

stages:
  - compile
  - build
  - test
  - coverage
  - sonarqube
  - build-image
  - push-image

variables:
  PNPM_CACHE_FOLDER: '$CI_PROJECT_DIR/.pnpm-store'
  DOCKER_DRIVER: overlay2

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

before_script:
  - npm install -g pnpm@11
  - pnpm config set store-dir $PNPM_CACHE_FOLDER
  - pnpm install --frozen-lockfile

# ─────────────────────────────────────────────────────────────────
# Stage 1: compile — static analysis (lint, format, OpenAPI, audit)
# ─────────────────────────────────────────────────────────────────
compile:
  stage: compile
  script:
    - echo "── ESLint (JS syntax + rules) ──"
    - pnpm lint
    - echo "── Prettier format check ──"
    - pnpm format:check
    - echo "── OpenAPI bundle (compiles spec to single YAML) ──"
    - pnpm openapi:bundle
    - echo "── OpenAPI validate (Redocly + Spectral) ──"
    - pnpm openapi:validate
    - echo "── Security audit (prod deps) ──"
    - pnpm audit --prod
    - pnpm audit || true
  artifacts:
    paths:
      - dist/openapi.bundle.yaml
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# ─────────────────────────────────────────────────────────────────
# Stage 2: build — validate source syntax + prod dependency install
# (Node.js backend has no compile step; this verifies the deployable
# artifact can be produced from source)
# ─────────────────────────────────────────────────────────────────
build:
  stage: build
  script:
    - echo "── Syntax check (entry points) ──"
    - node --check src/server.js
    - node --check src/app.js
    - node --check src/infrastructure/config/env.js
    - echo "── Production dependencies install ──"
    - pnpm install --prod --frozen-lockfile
    - echo "Production artifact ready (node_modules/ from --prod install)"
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# ─────────────────────────────────────────────────────────────────
# Stage 3: test — unit tests
# ─────────────────────────────────────────────────────────────────
test:
  stage: test
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    POSTGRES_DB: qatu_test
    TEST_DATABASE_URL: 'postgresql://test:test@postgres:5432/qatu_test'
  script:
    - pnpm test
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# ─────────────────────────────────────────────────────────────────
# Stage 4: coverage — coverage report (separate stage per lab)
# ─────────────────────────────────────────────────────────────────
coverage:
  stage: coverage
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    POSTGRES_DB: qatu_test
    TEST_DATABASE_URL: 'postgresql://test:test@postgres:5432/qatu_test'
  script:
    - pnpm test:coverage
  coverage: '/All files\s*\|\s*([\d.]+)/'
  artifacts:
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# ─────────────────────────────────────────────────────────────────
# Stage 5: sonarqube
# Scan qatu-api then wait for the quality gate before any image job
sonarqube-check:
  stage: sonarqube
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: ['']
  # Scanner image does not run the Node install from the root before_script
  before_script:
    - 'true'
  # First scan may fail the gate, image jobs must still run
  allow_failure: true
  needs:
    - job: coverage
      artifacts: true
  script:
    - >
      sonar-scanner
      -Dsonar.projectKey=qatu-api
      -Dsonar.sources=src
      -Dsonar.coverageReportPaths=coverage/cobertura-coverage.xml
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.token=$SONAR_TOKEN
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

sonarqube-quality-gate:
  stage: sonarqube
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: ['']
  # Scanner image does not run the Node install from the root before_script
  before_script:
    - 'true'
  # First scan may fail the gate, image jobs must still run
  allow_failure: true
  needs:
    - job: sonarqube-check
      artifacts: false
    - job: coverage
      artifacts: true
  script:
    - >
      sonar-scanner
      -Dsonar.projectKey=qatu-api
      -Dsonar.sources=src
      -Dsonar.coverageReportPaths=coverage/cobertura-coverage.xml
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.token=$SONAR_TOKEN
      -Dsonar.qualitygate.wait=true
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# ─────────────────────────────────────────────────────────────────
# Stage 6: build-image — build container, push temp tag
# Runs on all branches (validates Dockerfile) + tags
# ─────────────────────────────────────────────────────────────────
build-image:
  stage: build-image
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
      command: ['--tls=false']
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
    TEMP_TAG: $CI_REGISTRY_IMAGE:pipeline-$CI_PIPELINE_ID
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "Building container image (validation + temp tag push)"
    - docker build
      --target runtime
      --tag "$TEMP_TAG"
      --label "org.opencontainers.image.source=$CI_PROJECT_URL"
      --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
      --label "org.opencontainers.image.title=Qatu API"
      .
    - docker push "$TEMP_TAG"
    - echo "Image built and pushed to $TEMP_TAG"
  after_script:
    - docker logout "$CI_REGISTRY" || true
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  needs:
    - job: test
    - job: coverage
    - job: sonarqube-quality-gate
      artifacts: false

# ─────────────────────────────────────────────────────────────────
# Stage 7: push-image — re-tag with SemVer + push final tags
# Only on v* tag pushes (release events)
# ─────────────────────────────────────────────────────────────────
push-image:
  stage: push-image
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
      command: ['--tls=false']
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
    TEMP_TAG: $CI_REGISTRY_IMAGE:pipeline-$CI_PIPELINE_ID
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # ── Compute VERSION ─────────────────────────────────────────
    - |
      echo "── Resolving SemVer ──"
      PKG_VERSION=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -1)
      echo "package.json version: ${PKG_VERSION}"
      if [ -z "$PKG_VERSION" ]; then
        echo "::error::Could not read version from package.json"
        exit 1
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
        echo "Source: git tag → ${CI_COMMIT_TAG} → version ${VERSION}"
      else
        VERSION="${PKG_VERSION}"
        echo "Source: package.json → version ${VERSION}"
      fi
      if [ -n "$CI_COMMIT_TAG" ] && [ "${CI_COMMIT_TAG#v}" != "$PKG_VERSION" ]; then
        echo "::error::VERSION MISMATCH — git tag ${CI_COMMIT_TAG} does not match package.json ${PKG_VERSION}"
        exit 1
      fi
      DEV_TAG="DEV-${VERSION}"
      V_TAG="v${VERSION}"
      echo "DEV_TAG=${DEV_TAG}" > .env.tags
      echo "V_TAG=${V_TAG}" >> .env.tags
      echo "Resolved: DEV_TAG=${DEV_TAG}, V_TAG=${V_TAG}, latest=latest"
    # ── Load image + re-tag + push ──────────────────────────────
    - source .env.tags
    - docker pull "$TEMP_TAG"
    - docker tag "$TEMP_TAG" "$CI_REGISTRY_IMAGE:$DEV_TAG"
    - docker tag "$TEMP_TAG" "$CI_REGISTRY_IMAGE:$V_TAG"
    - docker tag "$TEMP_TAG" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:$DEV_TAG"
    - docker push "$CI_REGISTRY_IMAGE:$V_TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"
    - 'echo "Pushed 3 tags: $DEV_TAG, $V_TAG, latest"'
  after_script:
    - docker logout "$CI_REGISTRY" || true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
      when: on_success
    - when: never
  needs:
    - job: build-image
      artifacts: false
