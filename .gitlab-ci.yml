image: node:26

stages:
  - lint
  - test
  - build
  - security

variables:
  PNPM_CACHE_FOLDER: '$CI_PROJECT_DIR/.pnpm-store'

cache:
  paths:
    - .pnpm-store

before_script:
  - npm install -g pnpm@11
  - pnpm config set store-dir $PNPM_CACHE_FOLDER
  - pnpm install --frozen-lockfile

lint:
  stage: lint
  script:
    - pnpm lint
    - pnpm format:check
  only:
    - main
    - develop
    - merge_requests

openapi:lint:
  stage: lint
  script:
    - pnpm openapi:bundle
    - pnpm openapi:lint
    - pnpm openapi:validate
  only:
    - main
    - develop
    - merge_requests

test:
  stage: test
  image: node:26
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    POSTGRES_DB: qatu_test
    TEST_DATABASE_URL: 'postgresql://test:test@postgres:5432/qatu_test'
  script:
    - pnpm test
  only:
    - main
    - develop
    - merge_requests

security:
  stage: security
  script:
    # Audit production dependencies (fails on any vulnerability).
    # Dev-only packages like nodemon→braces have no upstream patch yet;
    # they are excluded here because --prod skips devDependencies.
    - pnpm audit --prod
    # Full audit for awareness (allowed to fail on unfixable dev-only advisories).
    - pnpm audit || true
  only:
    - main
    - develop
    - merge_requests
