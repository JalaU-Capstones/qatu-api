# ─────────────────────────────────────────────────────────────────────────────
# Qatu API — Docker Compose BASE
#
# ARCHITECTURE NOTE (ADR-020 / SP-19):
# There is intentionally NO `postgres` container. The single source of
# truth for auth + storage + public schemas is Supabase CLI on the host
# (:54322). Any container `postgres:17-alpine` would lack `auth.users`
# and cannot run migrations 003+. See .docs/MIGRATIONS.md and
# ADR-020 for rationale. Do not re-add this service without updating
# the ADR.
#
# This file holds the shared service definitions. It is NOT meant to be run
# on its own. Combine it with one of:
#
#   Development:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   Production:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up
#   Dev tools:    docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.dev-tools.yml up
#
# Per ADR-016: rabbitmq uses `expose` (internal only) in the base.
# Overrides decide whether to open host ports.
#
# Per ADR-018 / DevOps Lab W3 (#3), adapted to ADR-020 (no local postgres):
#   - `back-end`  → api + rabbitmq (broker stays off the cross-repo bridge)
#   - `qatu-net`  → api only on this side (client reaches api:3000)
#   Database is Supabase CLI on the host (:54322), not a compose service.
#   rabbitmq NEVER joins qatu-net (client must not reach the broker).
# ─────────────────────────────────────────────────────────────────────────────

services:
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-qatu}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-qatu_dev_password}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - back-end
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    expose:
      - '5672'

  api:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    networks:
      - back-end
      - qatu-net
    depends_on:
      rabbitmq:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - '3000'
    # Base healthcheck (Lab W3 / #3): present here so every override inherits it,
    # not only prod. Matches the Dockerfile HEALTHCHECK against /health.
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  rabbitmq_data:
    driver: local

networks:
  back-end:
    driver: bridge
    name: back-end
  qatu-net:
    driver: bridge
    name: qatu-net
