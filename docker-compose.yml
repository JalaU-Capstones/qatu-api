version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qatu
      POSTGRES_PASSWORD: qatu_dev_password
      POSTGRES_DB: qatu_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qatu -d qatu_dev']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - qatu-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: qatu
      RABBITMQ_DEFAULT_PASS: qatu_dev_password
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 10s
      retries: 5
    networks:
      - qatu-network

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@qatu.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    networks:
      - qatu-network
    depends_on:
      - postgres

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  qatu-network:
    driver: bridge
